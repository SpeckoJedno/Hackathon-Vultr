# Demo "internet" for the sandbox. Reachable ONLY from sandbox containers,
# under fake hostnames (Docker network aliases, see docker-compose.yml).
server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    autoindex off;
    # Phishing link goes through a tracking redirect first (shows redirect following)
    location = /track { return 302 /secure/verify; }
    location = /secure/verify { return 302 /fake-login.html?session=8f3a; }
    location ~ \.eml$ { deny all; }
    # The credential "harvester" just accepts the POST and shows nothing
    location = /harvest { return 200 "ok"; }
}
